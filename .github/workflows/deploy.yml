# This workflow deploys a Laravel application to a production server
# using SSH and SCP for a robust and secure CI/CD pipeline.
name: Deploy Laravel Application

on:
  push:
    # This workflow will run on pushes to the 'main' branch
    branches: [ main ]

jobs:
  deploy:
    # The job runs on the latest version of Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Uses the official action to check out your repository code
        uses: actions/checkout@v4

      - name: Setup PHP
        # Sets up the specified PHP version and extensions needed for your application
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, redis

      - name: Install Composer dependencies
        # Installs production-only dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        # Sets up Node.js for building frontend assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM dependencies and build assets
        # Installs NPM dependencies and builds the production assets on the runner
        run: |
          npm ci
          npm run build
          # The node_modules and other unneeded files are removed
          # to keep the deployment package as small as possible.
          rm -rf .git .gitignore node_modules

      - name: Run tests
        # A crucial step to run your tests before deployment
        run: php artisan test

      - name: Deploy with SCP
        # This action uses SCP to copy the entire codebase to the server
        # It's more reliable than `git pull` on the server as it ensures
        # the exact code built on the runner is deployed.
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./"
          # The real file path provided by the user
          target: "/www/htdocs/w01c7e90/clients-melasistema.com"

      - name: Run post-deployment commands on server
        # This action runs a series of commands on the production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Navigate to the application directory using the real path
            cd /www/htdocs/w01c7e90/clients-melasistema.com

            # Place the site in maintenance mode to prevent issues during migrations
            # A secret token can be used to bypass the maintenance page if needed
            php artisan down --secret='${{ secrets.MAINTENANCE_TOKEN }}'

            # Run database migrations
            php artisan migrate --force

            # Optimize the application and clear caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Restart any queue workers (e.g., Laravel Horizon)
            sudo supervisorctl restart laravel-worker:*

            # Bring the site back up
            php artisan up

            echo "Deployment completed successfully!"

