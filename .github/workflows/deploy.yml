# This workflow deploys a Laravel application to a production server
# using SSH and SCP for a robust and secure CI/CD pipeline.
name: Deploy Laravel Application

on:
  push:
    # This workflow will run on pushes to the 'master' branch
    branches: [ master ]

jobs:
  deploy:
    # The job runs on the latest version of Ubuntu
    runs-on: ubuntu-latest
    # This specifies the 'production' environment, which is required
    # to access secrets scoped to that environment.
    environment: production

    steps:
      - name: Checkout code
        # Uses the official action to check out your repository code
        uses: actions/checkout@v4
        # Adds a fetch-depth of 0 to get the full history, which is
        # required for standard-version to work correctly.
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Run standard-version and create a release
        # This step uses standard-version to automatically bump the version,
        # create a CHANGELOG.md, and create a git tag.
        run: |
          # Configure Git user for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Run standard-version to update version and changelog
          npx standard-version
          # Push the new commit and tag back to the repository using the PAT_TOKEN
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git --follow-tags

      - name: Setup PHP
        # Sets up the specified PHP version and extensions needed for your application
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, redis

      - name: Install Composer dependencies
        # Installs production-only dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        # Sets up Node.js for building frontend assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies and build assets
        # Installs NPM dependencies and builds the production assets on the runner
        run: |
          npm ci
          npm run build
          # The node_modules and other unneeded files are removed
          # to keep the deployment package as small as possible.
          rm -rf .git .gitignore node_modules

      - name: Deploy with SCP
        # This action uses SCP to copy the entire codebase to the server.
        # The wildcard `*` at the end of the source path ensures that
        # only the contents of the directory are copied, not the directory itself.
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./*"
          # The real file path provided by the user
          target: "/www/htdocs/w01c7e90/clients.melasistema.com"

      - name: Run post-deployment commands on server
        # This action runs a series of commands on the production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Navigate to the application directory using the real path
            cd /www/htdocs/w01c7e90/clients.melasistema.com

            # Place the site in maintenance mode to prevent issues during migrations
            # A secret token can be used to bypass the maintenance page if needed
            php artisan down --secret='${{ secrets.MAINTENANCE_TOKEN }}'

            # Run database migrations
            php artisan migrate --force

            # Create the symbolic link
            php artisan storage:link

            # Optimize the application and clear caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Restart any queue workers (e.g., Laravel Horizon)
            # sudo supervisorctl restart laravel-worker:*

            # Bring the site back up
            php artisan up

            echo "Deployment completed successfully!"

