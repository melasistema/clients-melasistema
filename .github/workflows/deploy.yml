name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on any new tag that starts with 'v' followed by numbers

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Checkout the tag, not the branch

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, redis

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Clean up production files
        # This is a critical step to ensure old files are removed.
        # The rsync action will handle this, but it's good to have it here
        # for a clean run. We delete everything except the .env file and storage folder.
        run: |
          ssh -i ~/.ssh/github_actions_deploy_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'cd clients.melasistema.com && rm -rf vendor public/js public/css public/build'

      - name: Copy files to server with Rsync
        uses: burnett01/rsync-deployments@v1.4
        with:
          # SSH details
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          # The source files to copy from the GitHub runner
          source: .
          # The destination folder on the remote server
          destination: /www/htdocs/w01c7e90/clients.melasistema.com/
          # Exclude sensitive files and folders from being copied
          exclude: ".git .gitignore .env"

      - name: Run post-deployment commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # --- Deployment script on the server ---

            # Navigate to your application's directory
            cd clients.melasistema.com

            # Place site in maintenance mode
            php artisan down --secret='${{ secrets.MAINTENANCE_TOKEN }}'

            # Run database migrations
            php artisan migrate --force

            # Clear and cache configurations
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Create symbolic link for storage if it doesn't exist
            php artisan storage:link

            # Bring site back up
            php artisan up

            echo "Deployment completed for tag: ${{ github.ref_name }}"
