name: Simple Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, redis

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies and build assets
        run: |
          npm ci
          npm run build
          # We'll remove these files and folders to avoid copying them
          # to the server as they are not needed in production.
          rm -rf .git .gitignore node_modules

      # The following step adds the SSH private key to a secure agent.
      # While the appleboy actions can take the key directly, this is good
      # practice for any custom scripts that might use the native ssh command.
      - name: Add SSH key to agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clean production directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # The key must be explicitly passed to this action.
          key: ${{ secrets.SSH_KEY }}
          script: |
            # A critical step to remove old files, but keep .env and storage.
            # This prevents old files from being left behind and causing issues.
            cd /www/htdocs/username/clients-melasistema.com
            find . -mindepth 1 -maxdepth 1 ! -name .env ! -name storage -exec rm -rf {} +
            echo "Production directory cleaned."

      - name: Copy files to server with SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # The key must be explicitly passed to this action.
          key: ${{ secrets.SSH_KEY }}
          source: "./"
          # Direct copy to the production folder
          target: "/www/htdocs/username/clients-melasistema.com"

      - name: Run post-deployment commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # The key must be explicitly passed to this action.
          key: ${{ secrets.SSH_KEY }}
          script: |
            # --- Deployment script on the server ---

            # Navigate to your application's directory
            cd /www/htdocs/w01c7e90/clients-melasistema.com

            # Place site in maintenance mode
            php artisan down --secret='${{ secrets.MAINTENANCE_TOKEN }}'

            # Run database migrations
            php artisan migrate --force

            # Clear and cache configurations
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Create symbolic link for storage if it doesn't exist
            php artisan storage:link

            # Bring site back up
            php artisan up

            echo "Deployment completed for tag: ${{ github.ref_name }}"
