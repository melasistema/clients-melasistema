name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on any new tag that starts with 'v' followed by numbers

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Checkout the tag, not the branch

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, redis

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clean up production files
        # A more robust approach to cleaning up files using rsync with a dummy source
        run: |
          rsync -av --delete --exclude '.env' --exclude 'storage' --exclude '.git' --exclude '.gitignore' /dev/null/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/htdocs/username/clients-melasistema.com/

      - name: Copy files to server with Rsync
        uses: burnett01/rsync-deployments@v1.5
        with:
          # SSH details
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          # The source files to copy from the GitHub runner
          source: .
          # The destination folder on the remote server
          destination: /www/htdocs/w01c7e90/clients-melasistema.com
          # Exclude sensitive files and folders from being copied
          exclude: ".git .gitignore .env"
          # Adding these options to ensure host key verification doesn't fail
          ssh_opts: '-o StrictHostKeyChecking=no'

      - name: Run post-deployment commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # --- Deployment script on the server ---

            # Navigate to your application's directory
            cd /www/htdocs/username/clients-melasistema.com

            # Place site in maintenance mode
            php artisan down --secret='${{ secrets.MAINTENANCE_TOKEN }}'

            # Run database migrations
            php artisan migrate --force

            # Clear and cache configurations
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Create symbolic link for storage if it doesn't exist
            php artisan storage:link

            # Bring site back up
            php artisan up

            echo "Deployment completed for tag: ${{ github.ref_name }}"
