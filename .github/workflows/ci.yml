# Continuous integration: lint -> test on every push/PR to development or master.
#
# This workflow is deliberately GENERIC — anyone who clones MelaFreelance gets a
# working lint + test pipeline with nothing personal in it. Deployment lives in a
# separate workflow (deploy.yml) you configure with your own server details; a
# cloner who deploys differently can delete deploy.yml and keep this file as-is.
#
# The build artifact produced by the `test` job is what deploy.yml ships, so the
# tested build is the deployed build.
name: CI

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

# Least privilege: nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Pin Node to 22 and install from the lockfile (npm ci), so the lint job
      # runs the exact Prettier/ESLint versions the repo pins — matching local
      # `nvm use 22` and the test job. Without this the runner's default Node and
      # a fresh `npm install` can resolve newer tools that flag passing code.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Check-only steps: fail the build on violations, never modify files.
      - name: Check PHP formatting (Pint)
        run: vendor/bin/pint --test

      - name: Check frontend formatting (Prettier)
        run: npm run format:check

      - name: Lint Frontend (ESLint)
        run: npx eslint .

      # Type-check the Vue/TS against the hand-written types in resources/js/types:
      # any drift or misuse of a domain type (Client/Project/Task/...) now fails CI,
      # so the types are an enforced contract, not just documentation.
      - name: Type-check Frontend (vue-tsc)
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Build Assets
        run: npm run build

      # Run with coverage (xdebug is provisioned above) and enforce a floor, so a
      # change that drops test coverage fails CI. The suite currently sits at ~88%;
      # 85 leaves headroom without letting coverage silently erode.
      - name: Tests
        run: ./vendor/bin/pest --coverage --min=85

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build
          retention-days: 1
          if-no-files-found: error

  # End-to-end smoke of the critical happy path (log in -> create client ->
  # project -> task -> start/stop a timer) in a real browser. Runs the app via
  # `php artisan serve` against an isolated SQLite build the suite sets up itself
  # (tests/e2e/prepare.mjs) — nothing here needs a database service. Kept as its
  # own job so it can be made non-blocking (or dropped) without touching lint/test.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: sqlite3, pdo_sqlite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare base environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build Assets
        run: npm run build

      # Cache the Playwright browser between runs (keyed on the pinned version) so
      # the ~150MB Chromium download only happens when the version changes.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
